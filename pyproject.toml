[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "eachboard"
version = "0.1.0"
description = "Local messaging for cooperating agents in a shared workspace"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
eachboard = "eachboard.cli:main"

[tool.setuptools.packages.find]
include = ["eachboard", "eachboard.*"]
